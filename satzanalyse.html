<script>
/* Die Inhalte (SATZANALYSE, SATZANALYSE_LABELS) kommen aus main.js —
   siehe <script src="main.js"> im <head>. */
const STORAGE_KEY = "satzanalyse_progress_v1";
const SOUND_KEY = "satzanalyse_sound_muted";
const MASTER_THRESHOLD = 3;

const ARABIC_REGEX = /[\u0600-\u06FF]/;
function isArabicText(t){ return ARABIC_REGEX.test(t || ""); }

/* ---------- Lektionen ---------- */
let selectedLesson = "alle";
function lessonList(){
  if(selectedLesson === "alle") return Object.values(SATZANALYSE);
  return [SATZANALYSE[selectedLesson]].filter(Boolean);
}
function currentDeck(){
  const items = [];
  lessonList().forEach(l => {
    (l.concepts || []).forEach(c => items.push({ kind: "concept", key: "c:" + c.term, term: c.term, explanation: c.explanation }));
    (l.questions || []).forEach(q => items.push({ kind: q.type, key: (q.type === "mc" ? "q:" + q.question : "t:" + q.statement), ...q }));
    (l.sentences || []).forEach(s => items.push({ kind: "satzbau", key: "s:" + s.words.map(w => w.text).join("|"), words: s.words, translation: s.translation }));
  });
  if(mode === "mix") return items;
  return items.filter(i => i.kind === mode);
}

/* ---------- Sound-Engine ---------- */
const Sound = (() => {
  let ctx = null;
  let muted = localStorage.getItem(SOUND_KEY) === "1";
  let combo = 0;

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type="sine", gainPeak=0.16, opts={}){
    if(muted) return;
    const c = ensureCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = opts.cutoff || 4200;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    if(opts.slideTo){
      osc.frequency.linearRampToValueAtTime(opts.slideTo, c.currentTime + start + dur);
    }
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + start + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(filter).connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.03);
  }

  return {
    click(){ tone(660, 0, 0.045, "triangle", 0.05, {cutoff: 3000}); },
    flip(){ tone(520, 0, 0.05, "triangle", 0.07); tone(780, 0.05, 0.08, "sine", 0.06); },
    correct(){
      combo = Math.min(combo + 1, 7);
      const step = Math.pow(2, combo / 12);
      tone(523.25 * step, 0,    0.11, "sine", 0.17);
      tone(659.25 * step, 0.05, 0.13, "sine", 0.13);
      tone(783.99 * step, 0.1,  0.18, "sine", 0.11);
    },
    wrong(){
      combo = 0;
      tone(233, 0,    0.16, "sine", 0.11, {slideTo: 180, cutoff: 1400});
      tone(174, 0.03, 0.2,  "sine", 0.08, {cutoff: 1200});
    },
    mastered(){
      combo = 0;
      tone(523.25, 0,    0.12, "sine", 0.15);
      tone(659.25, 0.08, 0.12, "sine", 0.15);
      tone(783.99, 0.16, 0.14, "sine", 0.15);
      tone(1046.5, 0.26, 0.32, "sine", 0.17);
      tone(1318.5, 0.3,  0.28, "sine", 0.09);
    },
    isMuted(){ return muted; },
    toggle(){
      muted = !muted;
      localStorage.setItem(SOUND_KEY, muted ? "1" : "0");
      if(!muted) this.click();
      return muted;
    }
  };
})();

let progress = loadProgress();
let mode = "satzbau";
let currentItem = null;
let sessionCorrect = 0, sessionTotal = 0;
let cardEl = document.getElementById("card");
let sessionWrongKeys = new Set();
let reviewQueue = [];
let inReview = false;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function getEntry(item){
  if(!progress[item.key]) progress[item.key] = { streak: 0, wrong: 0 };
  return progress[item.key];
}
function isMastered(item){
  return getEntry(item).streak >= MASTER_THRESHOLD;
}
function markResult(item, correct){
  const e = getEntry(item);
  const wasMastered = e.streak >= MASTER_THRESHOLD;
  if(correct){ e.streak += 1; } else { e.streak = 0; e.wrong += 1; }
  const justMastered = !wasMastered && e.streak >= MASTER_THRESHOLD;
  saveProgress();
  sessionTotal++; if(correct) sessionCorrect++;

  if(!correct){
    sessionWrongKeys.add(item.key);
    if(inReview && !reviewQueue.find(w => w.key === item.key)) reviewQueue.push(item);
  } else if(sessionWrongKeys.has(item.key)){
    sessionWrongKeys.delete(item.key);
    reviewQueue = reviewQueue.filter(w => w.key !== item.key);
  }

  if(justMastered) Sound.mastered();
  else if(correct) Sound.correct();
  else Sound.wrong();

  updateStats();
}

function updateStats(){
  const deck = currentDeck();
  document.getElementById("stat-total").innerText = deck.length;
  const masteredCount = deck.filter(isMastered).length;
  document.getElementById("stat-session").innerText = `${sessionCorrect}/${sessionTotal}`;
  const progressCount = deck.filter(item => getEntry(item).streak > 0).length;
  const pct = deck.length ? Math.round((progressCount / deck.length) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  if(pct === 100 && deck.length > 0){
    document.getElementById("progress-label").innerText = pct + " % — Alles gemeistert!";
    if(sessionWrongKeys.size > 0 && !inReview){
      startReviewRound();
    } else if(!window.__endShownFor || window.__endShownFor !== (selectedLesson + mode)){
      window.__endShownFor = selectedLesson + mode;
      try{ showEndOverlay(); }catch(e){}
    }
  } else {
    document.getElementById("progress-label").innerText = pct + " % bearbeitet";
    try{ hideEndOverlay(); }catch(e){}
  }
  document.getElementById("stat-mastered").innerText = `${masteredCount}/${deck.length}`;
}

function showEndOverlay(){
  const overlay = document.getElementById("end-overlay");
  const msg = document.getElementById("end-message");
  const label = selectedLesson === "alle" ? "allen Lektionen" : ((typeof SATZANALYSE_LABELS !== "undefined" && SATZANALYSE_LABELS[selectedLesson]) || `Lektion ${selectedLesson}`);
  msg.innerText = `Du hast alles in ${label} erfolgreich gelernt.`;
  overlay.classList.add("show"); overlay.setAttribute("aria-hidden","false");
}
function hideEndOverlay(){
  const overlay = document.getElementById("end-overlay");
  if(overlay){ overlay.classList.remove("show"); overlay.setAttribute("aria-hidden","true"); }
}
function replayLesson(){
  currentDeck().forEach(item => { const e = getEntry(item); e.streak = 0; e.wrong = 0; });
  saveProgress();
  window.__endShownFor = null;
  hideEndOverlay();
  updateStats();
  nextCard();
}
function backToAll(){
  selectedLesson = "alle";
  buildLessonTabs();
  window.__endShownFor = null;
  hideEndOverlay();
  updateScopeHint();
  updateStats();
  nextCard();
}
document.addEventListener("click", e => {
  if(e.target && e.target.id === "end-replay") replayLesson();
  if(e.target && e.target.id === "end-back") backToAll();
  if(e.target && e.target.id === "end-close") hideEndOverlay();
});

function weightedPick(list){
  const weights = list.map(item => {
    const e = getEntry(item);
    return Math.max(1, (e.wrong + 1) * 3 - e.streak);
  });
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<list.length;i++){
    r -= weights[i];
    if(r <= 0) return list[i];
  }
  return list[list.length-1];
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ---------- Lektionen-Auswahl ---------- */
/* Natürliche Sortierung: unterstützt reine Zahlen ("1", "12") ebenso wie
   Zahl+Buchstabe-Kombinationen ("9a", "14b") für Lektionsteile wie 9A/9B. */
function lessonKeySort(a, b){
  const pa = a.match(/^(\d+)(.*)$/) || [null, "0", a];
  const pb = b.match(/^(\d+)(.*)$/) || [null, "0", b];
  const na = Number(pa[1]), nb = Number(pb[1]);
  if(na !== nb) return na - nb;
  return String(pa[2]).localeCompare(String(pb[2]));
}

function updateScopeHint(){
  const hintEl = document.getElementById("scope-hint");
  if(!hintEl) return;
  if(selectedLesson === "alle"){
    hintEl.innerHTML = "Übt Sätze aus <b>allen Lektionen</b> gemischt (kumulativ).";
    return;
  }
  const label = (SATZANALYSE_LABELS[selectedLesson] || `Lektion ${selectedLesson}`).replace("Lektion ", "");
  hintEl.innerHTML = `Übt nur <b>Lektion ${label}</b>.`;
}

function buildLessonTabs(){
  const wrap = document.getElementById("lesson-tabs");
  wrap.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "lesson-pill" + (selectedLesson === "alle" ? " active" : "");
  allBtn.textContent = "Alle";
  allBtn.dataset.key = "alle";
  wrap.appendChild(allBtn);

  Object.keys(SATZANALYSE).sort(lessonKeySort).forEach(key => {
    const l = SATZANALYSE[key];
    const hasContent = (l.concepts && l.concepts.length) || (l.questions && l.questions.length);
    const btn = document.createElement("button");
    btn.className = "lesson-pill" + (hasContent ? "" : " disabled") + (selectedLesson === key ? " active" : "");
    btn.textContent = (typeof SATZANALYSE_LABELS !== "undefined" && SATZANALYSE_LABELS[key]) || `Lektion ${key}`;
    btn.dataset.key = key;
    if(!hasContent) btn.title = "noch keine Inhalte in dieser Lektion";
    wrap.appendChild(btn);
  });

  /* onclick statt addEventListener: buildLessonTabs() läuft mehrfach (z. B. bei
     "Zurück zur Übersicht"), und sonst würde der Listener jedes Mal doppelt
     registriert — ein Klick löste dann mehrere Karten-Wechsel und Sounds aus. */
  wrap.onclick = e => {
    const btn = e.target.closest(".lesson-pill");
    if(!btn || btn.classList.contains("disabled")) return;
    Sound.click();
    selectedLesson = btn.dataset.key;
    [...wrap.children].forEach(b => b.classList.toggle("active", b === btn));
    window.__endShownFor = null;
    updateScopeHint();
    updateStats();
    nextCard();
  };
}

function nextCard(){
  const deck = currentDeck();
  if(deck.length === 0){
    const label = selectedLesson === "alle" ? "Inhalte" : `Lektion ${selectedLesson}`;
    cardEl.innerHTML = `<div class="empty-state"><div class="big">Noch keine ${label} hinterlegt.</div>Trage Konzepte/Fragen in <kbd>main.js</kbd> in der passenden Lektion ein.</div>`;
    return;
  }
  if(inReview){
    if(reviewQueue.length === 0){
      inReview = false;
      sessionWrongKeys.clear();
      try{ showEndOverlay(); }catch(e){}
      return;
    }
    currentItem = reviewQueue.shift();
  } else {
    currentItem = weightedPick(deck);
  }
  if(currentItem.kind === "concept") renderConcept();
  else if(currentItem.kind === "mc") renderMC();
  else if(currentItem.kind === "satzbau") renderSatzbau();
  else renderTrueFalse();
}

function startReviewRound(){
  const deck = currentDeck();
  reviewQueue = [];
  sessionWrongKeys.forEach(k => {
    const item = deck.find(x => x.key === k);
    if(item) reviewQueue.push(item);
  });
  if(reviewQueue.length === 0){ sessionWrongKeys.clear(); inReview = false; return; }
  reviewQueue = shuffle(reviewQueue);
  inReview = true;
  hideEndOverlay();
  document.getElementById("progress-label").innerText = `Wiederhole falsch beantwortete Punkte (${reviewQueue.length})`;
  nextCard();
}

function renderConcept(){
  const item = currentItem;
  cardEl.innerHTML = `
    <div class="prompt-hint">Begriff — antippen zum Umdrehen</div>
    <div id="concept-face" class="concept-term" style="cursor:pointer;">${item.term}</div>
    <div class="tap-hint">Leertaste oder Klick zum Umdrehen</div>
    <div id="flash-actions" class="flash-actions" style="display:none;">
      <button class="btn-again" id="btn-again">✗ Nochmal</button>
      <button class="btn-know" id="btn-know">✓ Kenn ich</button>
    </div>
  `;
  const face = document.getElementById("concept-face");
  const actions = document.getElementById("flash-actions");
  function flip(){
    Sound.flip();
    face.innerText = item.explanation;
    face.className = "concept-explanation";
    actions.style.display = "flex";
    document.removeEventListener("keydown", flipHandler);
  }
  function flipHandler(e){ if(e.code === "Space"){ e.preventDefault(); flip(); } }
  face.onclick = flip;
  document.addEventListener("keydown", flipHandler);

  setTimeout(() => {
    const again = document.getElementById("btn-again");
    const know = document.getElementById("btn-know");
    if(again) again.onclick = () => { if(actions.style.display !== "none"){ markResult(currentItem, false); nextCard(); } };
    if(know) know.onclick = () => { if(actions.style.display !== "none"){ markResult(currentItem, true); nextCard(); } };
  }, 0);
}

function renderMC(){
  const item = currentItem;
  const questionHtml = item.question;
  cardEl.innerHTML = `
    <div class="prompt-hint">Multiple Choice</div>
    <div class="grammar-question">${questionHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="explain-text" id="explain" style="display:none;"></div>
    <div class="mc-grid" id="mc-grid"></div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Frage ➔</button>
  `;
  const grid = document.getElementById("mc-grid");
  item.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (isArabicText(choice) ? " ar" : "");
    btn.innerHTML = choice;
    btn.dataset.choice = choice;
    btn.onclick = () => selectMC(choice, btn, item.correct, item.explanation);
    grid.appendChild(btn);
  });
  document.getElementById("next-btn").onclick = nextCard;
}

function selectMC(choice, btn, correctAnswer, explanation){
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const explainEl = document.getElementById("explain");
  const correct = choice === correctAnswer;
  markResult(currentItem, correct);
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctAnswer}`;
    feedback.className = "feedback bad";
    buttons.forEach(b => { if(b.dataset.choice === correctAnswer) b.classList.add("correct"); });
  }
  if(explanation){ explainEl.innerText = explanation; explainEl.style.display = "block"; }
  document.getElementById("next-btn").style.display = "block";
}

function renderTrueFalse(){
  const item = currentItem;
  cardEl.innerHTML = `
    <div class="prompt-hint">Richtig oder Falsch?</div>
    <div class="grammar-question">${item.statement}</div>
    <div class="feedback" id="feedback"></div>
    <div class="explain-text" id="explain" style="display:none;"></div>
    <div class="tf-grid" id="tf-grid">
      <button class="tf-btn" id="tf-true">Wahr</button>
      <button class="tf-btn" id="tf-false">Falsch</button>
    </div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Frage ➔</button>
  `;
  document.getElementById("tf-true").onclick = (e) => selectTF(true, e.target, item.correct, item.explanation);
  document.getElementById("tf-false").onclick = (e) => selectTF(false, e.target, item.correct, item.explanation);
  document.getElementById("next-btn").onclick = nextCard;
}

function selectTF(choice, btn, correctAnswer, explanation){
  const buttons = document.querySelectorAll(".tf-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const explainEl = document.getElementById("explain");
  const correct = choice === correctAnswer;
  markResult(currentItem, correct);
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctAnswer ? "Wahr" : "Falsch"}`;
    feedback.className = "feedback bad";
    document.getElementById(correctAnswer ? "tf-true" : "tf-false").classList.add("correct");
  }
  if(explanation){ explainEl.innerText = explanation; explainEl.style.display = "block"; }
  document.getElementById("next-btn").style.display = "block";
}

/* ---------- Satzbau-Modus: mehrstufige Satzanalyse ---------- */
let satzbauState = null;

/* Feste Farbzuordnung je Grammatik-Rolle, damit z. B. Mubtada immer gold
   und Khabar immer türkis erscheint — konsistent über alle Lektionen. */
const ROLE_COLORS = {
  "Mubtada": "#e5ba73",
  "Khabar": "#7fd6c2",
  "Mudaf": "#7fa8e8",
  "Mudaf ilaihi": "#c98af0",
  "Na't": "#f0a8c9",
  "Man'ut": "#9ee87a",
  "Harful Jarr": "#f0935a",
  "Majrur": "#f0e07a",
  "Marfu": "#c9a878",
  "Mudhakkar": "#8fb8e0",
  "Muannath": "#e0a8d4",
  "Bestimmt": "#a8c9e0",
  "Unbestimmt": "#e0c9a8",
  "Relativpronomen": "#8a6ad9",
  "Fi'l": "#7ad4d9",
  "Fa'il": "#d97ad4",
  "Mabni": "#ff8f8f",
  "Mu'rab": "#7ab8ff",

  "Mahallan Marfu": "#e8905c",
  "Mahallan Majrur": "#c8e04a",
  "Mahallan Mansub": "#4acfa0"
};
/* Anzeigename inkl. arabischem Original — wird für Rollen-Buttons und
   zugewiesene Wort-Badges verwendet. Der kurze Schlüssel (links) bleibt
   die interne, stabile Kennung für Logik/Datenabgleich. */
const ROLE_LABELS = {
  "Mubtada": "Mubtada (مبتدأ)",
  "Khabar": "Khabar (خبر)",
  "Mudaf": "Mudaf (مضاف)",
  "Mudaf ilaihi": "Mudaf ilaihi (مضاف إليه)",
  "Na't": "Na't (نعت)",
  "Man'ut": "Man'ut (منعوت)",
  "Harful Jarr": "Harful-Jarr (حرف جر)",
  "Majrur": "Majrur (مجرور)",
  "Marfu": "Marfû' (مرفوع)",
  "Mudhakkar": "Mudhakkar (مذكر)",
  "Muannath": "Mu'annath (مؤنث)",
  "Bestimmt": "Bestimmt (معرفة)",
  "Unbestimmt": "Unbestimmt (نكرة)",
  "Relativpronomen": "Relativpronomen (الاسم الموصول)",
  "Fi'l": "Fi'l (فعل)",
  "Fa'il": "Fa'il (فاعل)",
  "Mabni": "Mabnī (مبني)",
  "Mu'rab": "Mu'rab (معرب)",
  "Mansub": "Mansûb (منصوب)",
  "Mahallan Marfu": "Mahallan marfû' (في محل رفع)",
  "Mahallan Majrur": "Mahallan majrûr (في محل جر)",
  "Mahallan Mansub": "Mahallan mansûb (في محل نصب)"
};
const ROLE_FALLBACK_PALETTE = ["#e5ba73", "#7fd6c2", "#7fa8e8", "#c98af0", "#f0a8c9", "#9ee87a", "#f0935a", "#f0e07a"];
function roleColor(role, idx){
  return ROLE_COLORS[role] || ROLE_FALLBACK_PALETTE[(idx || 0) % ROLE_FALLBACK_PALETTE.length];
}
function roleLabel(role){
  return ROLE_LABELS[role] || role;
}
function hexToRgba(hex, alpha){
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* Jedes Wort trägt jetzt tags:{ebene: Rolle} statt einer einzelnen role.
   Fehlt eine Ebene bei einem Wort, ist es in dieser Runde nicht anklickbar
   (entweder ein Füllwort wie وَ, oder auf dieser Ebene bereits geklärt). */
function wordTag(word, level){
  return word.tags ? word.tags[level] : undefined;
}
/* Nur Ebenen mit echter Auswahl liefern (mindestens 2 unterschiedliche
   Rollen). Ebenen, bei denen wegen einer grammatischen Übereinstimmungsregel
   ohnehin nur ein Wert infrage kommt (z. B. Geschlecht/Bestimmtheit bei
   Na't+Man'ut, die per Definition immer übereinstimmen), wären kein echtes
   Rätsel — die werden hier übersprungen. */
function usableLevels(item){
  const raw = (() => {
    let max = 1;
    item.words.forEach(w => { if(w.tags){ Object.keys(w.tags).forEach(k => { max = Math.max(max, Number(k)); }); } });
    return max;
  })();
  const list = [];
  for(let lvl = 1; lvl <= raw; lvl++){
    const roles = new Set(item.words.map(w => wordTag(w, lvl)).filter(r => r !== undefined));
    if(roles.size >= 2) list.push(lvl);
  }
  return list.length ? list : [1];
}

function renderSatzbau(){
  const item = currentItem;
  const blankWords = item.words
    .map((w, i) => ({ w, i }))
    .filter(o => o.w.blank);
  satzbauState = {
    words: item.words,
    levels: usableLevels(item),
    levelIndex: 0,
    assignments: {},
    selected: null,
    checked: false,
    overallCorrect: true,
    blankWords: blankWords,
    blankIndex: 0,
    blankCorrect: true
  };
  if(blankWords.length > 0){
    renderBlankPhase();
  } else {
    renderSatzbauLevel();
  }
}

/* ---------- Suffix-Lücken-Phase ----------
   Läuft VOR der Mubtada/Khabar-Zuordnung, wenn ein Wort ein
   blank-Feld trägt (z. B. كِتَابُ___ + Optionen كَ/هُ/هَا/ي als
   komplette Wortformen). Erst wenn alle Lücken dieses Satzes
   geklärt sind, geht es normal mit renderSatzbauLevel() weiter. */
function renderBlankPhase(){
  const item = currentItem;
  const entry = satzbauState.blankWords[satzbauState.blankIndex];
  const total = satzbauState.blankWords.length;

  cardEl.innerHTML = `
    <div class="prompt-hint">Welche Form passt?${total > 1 ? ` (Lücke ${satzbauState.blankIndex + 1}/${total})` : ""}</div>
    ${item.translation ? `<div class="satzbau-translation">${item.translation}</div>` : ""}
    <div class="sentence-plaque"><div class="word-row" id="word-row"></div></div>
    <div class="feedback" id="feedback"></div>
    <div class="mc-grid" id="blank-grid"></div>
    <button class="next-btn" id="blank-next-btn" style="display:none;">Weiter ➔</button>
  `;

  const wordRow = document.getElementById("word-row");
  item.words.forEach((word, idx) => {
    const span = document.createElement("div");
    span.className = "word-static";
    if(idx === entry.i){
      span.id = "blank-slot";
      span.innerText = "……";
    } else {
      span.innerText = word.text;
    }
    wordRow.appendChild(span);
  });

  const grid = document.getElementById("blank-grid");
  const options = shuffle([...entry.w.blank.options]);
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn ar";
    btn.innerText = opt;
    btn.onclick = () => selectBlank(opt, btn, entry.w.text);
    grid.appendChild(btn);
  });

  document.getElementById("blank-next-btn").onclick = () => {
    satzbauState.blankIndex++;
    if(satzbauState.blankIndex < satzbauState.blankWords.length){
      renderBlankPhase();
    } else {
      renderSatzbauLevel();
    }
  };
}

function selectBlank(choice, btn, correctText){
  const buttons = document.querySelectorAll("#blank-grid .opt-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const slot = document.getElementById("blank-slot");
  const correct = choice === correctText;
  if(!correct) satzbauState.blankCorrect = false;
  if(slot) slot.innerText = correctText;
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
    Sound.correct();
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctText}`;
    feedback.className = "feedback bad";
    buttons.forEach(b => { if(b.innerText === correctText) b.classList.add("correct"); });
    Sound.wrong();
  }
  document.getElementById("blank-next-btn").style.display = "block";
}

function renderSatzbauLevel(){
  const item = currentItem;
  const level = satzbauState.levels[satzbauState.levelIndex];
  satzbauState.assignments[level] = new Array(item.words.length).fill(null);
  satzbauState.selected = null;
  satzbauState.checked = false;

  const roles = [...new Set(item.words.map(w => wordTag(w, level)).filter(r => r !== undefined))];
  const levelHint = satzbauState.levels.length > 1
    ? `<div class="level-hint">Ebene ${satzbauState.levelIndex + 1} von ${satzbauState.levels.length} — ${roles.map(roleLabel).join(" · ")}</div>`
    : "";

  cardEl.innerHTML = `
    <div class="prompt-hint">Wort antippen, dann Rolle wählen</div>
    ${levelHint}
    ${item.translation ? `<div class="satzbau-translation">${item.translation}</div>` : ""}
    <div class="sentence-plaque"><div class="word-row" id="word-row"></div></div>
    <div class="role-row" id="role-row"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="check-btn" disabled>Prüfen</button>
  `;
  const wordRow = document.getElementById("word-row");
  item.words.forEach((w, i) => {
    const tag = wordTag(w, level);
    if(tag === undefined){
      const span = document.createElement("div");
      span.className = "word-static";
      span.innerText = w.text;
      wordRow.appendChild(span);
    } else {
      const btn = document.createElement("button");
      btn.className = "word-btn";
      btn.innerHTML = `<span class="w-text">${w.text}</span>`;
      btn.dataset.index = i;
      btn.onclick = () => selectWord(i);
      wordRow.appendChild(btn);
    }
  });
  const roleRow = document.getElementById("role-row");
  roles.forEach((r, idx) => {
    const color = roleColor(r, idx);
    const btn = document.createElement("button");
    btn.className = "role-btn";
    btn.innerHTML = `<span class="dot"></span><span>${roleLabel(r)}</span>`;
    btn.dataset.role = r;
    btn.dataset.color = color;
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.onclick = () => assignRole(r);
    roleRow.appendChild(btn);
  });
  document.getElementById("check-btn").onclick = checkSatzbau;
}

function refreshRoleHighlight(){
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  const assignedHere = satzbauState.selected !== null ? satzbauState.assignments[lvl][satzbauState.selected] : null;
  document.querySelectorAll("#role-row .role-btn").forEach(b => {
    const isActive = b.dataset.role === assignedHere;
    b.style.background = isActive ? hexToRgba(b.dataset.color, 0.18) : "rgba(255, 255, 255, 0.03)";
    b.style.boxShadow = isActive ? `0 0 0 2px ${hexToRgba(b.dataset.color, 0.35)}` : "none";
  });
}

function selectWord(i){
  if(satzbauState.checked) return;
  Sound.click();
  satzbauState.selected = i;
  document.querySelectorAll("#word-row .word-btn").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.index) === i);
  });
  refreshRoleHighlight();
}

function assignRole(role){
  if(satzbauState.checked || satzbauState.selected === null) return;
  Sound.click();
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  const i = satzbauState.selected;
  satzbauState.assignments[lvl][i] = role;
  const btn = document.querySelector(`#word-row .word-btn[data-index="${i}"]`);
  if(btn){
    const roleBtn = document.querySelector(`#role-row .role-btn[data-role="${CSS.escape(role)}"]`);
    const c = roleBtn ? roleBtn.dataset.color : roleColor(role, 0);
    btn.innerHTML = `<span class="w-text">${satzbauState.words[i].text}</span><span class="w-role" style="color:${c}">${roleLabel(role)}</span>`;
    btn.style.borderColor = c;
  }
  refreshRoleHighlight();
  const taggable = satzbauState.words
    .map((w, idx) => ({ w, idx }))
    .filter(o => wordTag(o.w, lvl) !== undefined);
  const allAssigned = taggable.every(o => satzbauState.assignments[lvl][o.idx]);
  document.getElementById("check-btn").disabled = !allAssigned;
}

function checkSatzbau(){
  const item = currentItem;
  if(satzbauState.checked){
    if(satzbauState.levelIndex < satzbauState.levels.length - 1){
      satzbauState.levelIndex++;
      renderSatzbauLevel();
    } else {
      markResult(item, satzbauState.overallCorrect && satzbauState.blankCorrect);
      nextCard();
    }
    return;
  }
  satzbauState.checked = true;
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  let levelCorrect = true;
  satzbauState.words.forEach((w, i) => {
    const tag = wordTag(w, lvl);
    if(tag === undefined) return;
    const btn = document.querySelector(`#word-row .word-btn[data-index="${i}"]`);
    const correct = satzbauState.assignments[lvl][i] === tag;
    if(!correct){
      levelCorrect = false;
      if(btn) btn.innerHTML = `<span class="w-text">${w.text}</span><span class="w-role">${roleLabel(tag)}</span>`;
    }
    if(btn){
      btn.classList.add(correct ? "correct" : "wrong");
      btn.style.borderColor = "";
      const roleSpan = btn.querySelector(".w-role");
      if(roleSpan) roleSpan.style.color = correct ? "#7fd6c2" : "#d98a73";
    }
  });
  satzbauState.overallCorrect = satzbauState.overallCorrect && levelCorrect;
  document.querySelectorAll("#role-row .role-btn").forEach(b => b.disabled = true);
  document.querySelectorAll("#word-row .word-btn").forEach(b => b.onclick = null);
  const feedback = document.getElementById("feedback");
  if(levelCorrect){
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    feedback.innerText = "Nicht ganz — die richtige Zuordnung ist jetzt markiert.";
    feedback.className = "feedback bad";
  }
  const checkBtn = document.getElementById("check-btn");
  checkBtn.innerText = satzbauState.levelIndex < satzbauState.levels.length - 1 ? "Nächste Ebene ➔" : "Nächste Frage ➔";
  checkBtn.disabled = false;
}

document.getElementById("shuffle-btn").addEventListener("click", () => { Sound.click(); nextCard(); });
document.getElementById("reset-progress-btn").addEventListener("click", () => {
  if(confirm("Gesamten Fortschritt zurücksetzen?")){
    progress = {};
    saveProgress();
    sessionCorrect = 0; sessionTotal = 0;
    updateStats();
    nextCard();
  }
});
const soundBtn = document.getElementById("sound-toggle");
function refreshSoundBtn(){ soundBtn.innerText = Sound.isMuted() ? "🔇" : "🔊"; }
soundBtn.addEventListener("click", () => { Sound.toggle(); refreshSoundBtn(); });
refreshSoundBtn();

// Init
if (typeof SATZANALYSE === "undefined") {
  cardEl.innerHTML = `<div class="empty-state"><div class="big">main.js wurde nicht geladen.</div>Prüfe, ob <kbd>main.js</kbd> im selben Ordner liegt und <kbd>const SATZANALYSE = {...}</kbd> enthält.</div>`;
} else {
  buildLessonTabs();
  updateScopeHint();
  updateStats();
  nextCard();
}
</script>
