<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satzanalyse | Boycott-Buddy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

:root {
  --primary-color: #e5ba73;
  --secondary-color: #8e7b43;
  --accent-color: #f4c26f;
  --dark-color: #060911;
  --light-color: #f8f9fa;
  --text-color: #e7e7ea;
  --text-light: #f8f9fa;
  --wrong-color: #d98a73;
  --font-main: 'Poppins', sans-serif;
  --font-heading: 'Playfair Display', serif;
  --font-arabic: 'Noto Naskh Arabic', serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: var(--font-main);
  margin: 0;
  padding: 0 0 4rem;
  background-color: var(--dark-color);
  background-image:
    radial-gradient(circle at 50% -10%, rgba(229, 186, 115, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 50% 15%, rgba(15, 23, 42, 0.95) 0%, var(--dark-color) 75%);
  background-attachment: fixed;
  color: var(--text-light);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><g fill="none" stroke="%23e5ba73" stroke-width="0.3" stroke-opacity="0.12"><path d="M30 0 L60 30 L30 60 L0 30 Z M0 0 L60 60 M60 0 L0 60 M30 0 L30 60 M0 30 L60 30"/><circle cx="30" cy="30" r="12"/><path d="M30 12 L42 30 L30 48 L18 30 Z"/></g></svg>');
  background-size: 120px 120px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--dark-color);
  z-index: 9999;
  animation: fadeOverlay 1.2s ease forwards;
  pointer-events: none;
}

@keyframes fadeOverlay { from { opacity: 1; } to { opacity: 0; } }

header {
  text-align: center;
  padding: 4.5rem 1rem 1.25rem;
  position: relative;
  z-index: 10;
}

.header-star {
  display: block;
  width: 80px;
  height: 80px;
  margin: 0 auto 18px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23e5ba73'><circle cx='50' cy='50' r='39' stroke-width='0.5' stroke-dasharray='2 2'/><path d='M50 14 L56 44 L86 50 L56 56 L50 86 L44 56 L14 50 L44 44 Z' stroke-width='1.6' stroke-linejoin='round'/><circle cx='50' cy='50' r='24' stroke-width='0.8'/></g></svg>");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  animation: starGlowPulse 4s ease-in-out infinite;
}

@keyframes starGlowPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(229, 186, 115, 0.45)); }
  50% { transform: scale(1.04); filter: drop-shadow(0 0 35px rgba(244, 194, 111, 0.75)); }
}

h1 {
  font-family: var(--font-heading);
  font-weight: 500;
  font-size: 2.4rem;
  letter-spacing: 0.5px;
  margin: 0;
  background: linear-gradient(to bottom, #ffffff 40%, #cdd7e5 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header .ar-sub {
  display: block;
  font-family: var(--font-arabic);
  font-weight: 500;
  color: var(--accent-color);
  font-size: 1.2rem;
  line-height: 1.8;
  margin-top: 0.4rem;
}

header p.subtitle {
  color: #52668d;
  font-size: 0.9rem;
  font-weight: 400;
  letter-spacing: 0.8px;
  margin-top: 0.6rem;
}

header .divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin: 1.1rem auto 0;
  width: 180px;
}
header .divider::before,
header .divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(to var(--dir, right), transparent, rgba(229, 186, 115, 0.45));
}
header .divider::after { --dir: left; }
header .divider .diamond {
  width: 6px; height: 6px;
  background: var(--primary-color);
  transform: rotate(45deg);
  flex-shrink: 0;
  opacity: 0.85;
}

header .nav-link {
  display: inline-block;
  margin-top: 0.9rem;
  font-size: 0.78rem;
  color: #7d8bab;
  text-decoration: none;
  border-bottom: 1px dotted rgba(255,255,255,0.2);
}
header .nav-link:hover { color: var(--accent-color); border-color: var(--accent-color); }

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 1.25rem;
  position: relative;
  z-index: 10;
}

.stats-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.stats-pill {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 999px;
  overflow: hidden;
  font-size: 0.8rem;
}
.stats-pill div { padding: 0.6rem 1.1rem; border-right: 1px solid rgba(255, 255, 255, 0.08); white-space: nowrap; color: var(--text-color); }
.stats-pill div:last-child { border-right: none; }
.stats-pill b { color: var(--accent-color); font-family: var(--font-heading); font-size: 0.95rem; }
.stats-pill .mastered b { color: #7fd6c2; }

.icon-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 999px;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-light);
  font-size: 1rem;
  transition: all 0.3s ease;
}
.icon-btn:hover { border-color: rgba(229, 186, 115, 0.35); box-shadow: 0 0 15px rgba(229, 186, 115, 0.2); }

.pill-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.7rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.pill-group {
  display: flex;
  gap: 0.35rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  padding: 0.3rem;
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.pill-btn {
  font-family: var(--font-main);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-color);
  background: transparent;
  border: none;
  border-radius: 10px;
  padding: 0.55rem 0.95rem;
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
}
.pill-btn:hover { color: var(--accent-color); }
.pill-btn.active {
  background: rgba(229, 186, 115, 0.15);
  color: var(--accent-color);
  box-shadow: inset 0 0 0 1px rgba(229, 186, 115, 0.4);
}

.lesson-pill {
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-color);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  cursor: pointer;
  transition: all 0.25s ease;
}
.lesson-pill:hover:not(.disabled) { border-color: rgba(229, 186, 115, 0.35); color: var(--accent-color); transform: translateY(-1px); }
.lesson-pill.active {
  background: rgba(229, 186, 115, 0.15);
  border-color: var(--primary-color);
  color: var(--accent-color);
  box-shadow: 0 0 15px rgba(229, 186, 115, 0.2);
}
.lesson-pill.disabled { opacity: 0.3; cursor: not-allowed; }

.scope-hint {
  text-align: center;
  font-size: 0.75rem;
  color: #7d8bab;
  margin: -0.4rem 0 1rem;
  letter-spacing: 0.02em;
}
.scope-hint b { color: var(--accent-color); font-weight: 600; }

.toggle-pill {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--text-color);
  user-select: none;
}
.toggle-pill b { color: var(--accent-color); }

.card-outer { position: relative; margin: 1.5rem 0; }
.corner { position: absolute; width: 24px; height: 24px; opacity: 0.55; }
.corner.tl { top: -6px; left: -6px; }
.corner.tr { top: -6px; right: -6px; transform: scaleX(-1); }
.corner.bl { bottom: -6px; left: -6px; transform: scaleY(-1); }
.corner.br { bottom: -6px; right: -6px; transform: scale(-1, -1); }

.card {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(229, 186, 115, 0.06) 0%, transparent 60%),
    rgba(255, 255, 255, 0.03);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  padding: 3rem 2rem;
  min-height: 290px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem;
  text-align: center;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.card:hover {
  border-color: rgba(229, 186, 115, 0.3);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 25px rgba(229, 186, 115, 0.15);
}
@keyframes cardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card > * { animation: cardEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
@media (prefers-reduced-motion: reduce) {
  .card > * { animation: none; }
}

.empty-state { color: #7d8bab; max-width: 420px; line-height: 1.6; }
.empty-state .big { font-family: var(--font-heading); font-size: 1.2rem; color: var(--text-light); margin-bottom: 8px; }

.prompt-hint { font-size: 0.75rem; color: #7d8bab; letter-spacing: 0.06em; text-transform: uppercase; }
.level-hint {
  font-size: 0.72rem; color: var(--accent-color); letter-spacing: 0.04em;
  font-weight: 600; text-align: center;
}

.concept-term { font-family: var(--font-heading); font-size: 1.55rem; font-weight: 600; color: var(--text-light); line-height: 1.4; }
.concept-explanation { font-size: 1rem; line-height: 1.8; color: var(--text-color); max-width: 520px; text-align: left; }

.grammar-question { font-size: 1.12rem; line-height: 1.9; color: var(--text-light); max-width: 520px; }
.grammar-question .ar { font-family: var(--font-arabic); font-size: 1.3rem; }

.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; width: 100%; max-width: 480px; }
@media (max-width: 480px) { .mc-grid { grid-template-columns: 1fr; } }
.opt-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.09);
  color: var(--text-light);
  font-family: var(--font-main), var(--font-arabic);
  font-size: 0.98rem; font-weight: 500;
  line-height: 1.6;
  padding: 0.9rem 0.75rem;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.opt-btn.ar { font-family: var(--font-arabic); font-size: 1.1rem; }
.opt-btn:hover:not(:disabled) { border-color: var(--primary-color); background: rgba(229, 186, 115, 0.08); }
.opt-btn:disabled { cursor: default; }
.opt-btn.correct { background: rgba(127, 214, 194, 0.15); border-color: #7fd6c2; color: #7fd6c2; }
.opt-btn.wrong { background: rgba(217, 138, 115, 0.15); border-color: var(--wrong-color); color: var(--wrong-color); }

.tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; width: 100%; max-width: 340px; }
.tf-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.09);
  color: var(--text-light);
  font-family: var(--font-main);
  font-size: 1rem; font-weight: 600;
  padding: 1rem 0.75rem;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tf-btn:hover:not(:disabled) { border-color: var(--primary-color); background: rgba(229, 186, 115, 0.08); }
.tf-btn:disabled { cursor: default; }
.tf-btn.correct { background: rgba(127, 214, 194, 0.15); border-color: #7fd6c2; color: #7fd6c2; }
.tf-btn.wrong { background: rgba(217, 138, 115, 0.15); border-color: var(--wrong-color); color: var(--wrong-color); }

.feedback { font-size: 0.9rem; font-weight: 600; min-height: 20px; }
.feedback.ok { color: #7fd6c2; }
.feedback.bad { color: var(--wrong-color); }
.explain-text { font-size: 0.85rem; color: #9fb0d4; max-width: 480px; line-height: 1.6; font-style: italic; }

.flash-actions { display: flex; gap: 0.6rem; width: 100%; max-width: 420px; }
.flash-actions button {
  flex: 1; padding: 0.85rem; border-radius: 12px;
  font-family: var(--font-main); font-weight: 600; font-size: 0.86rem; cursor: pointer;
  border: 1px solid; transition: all 0.2s ease;
}
.btn-again { background: rgba(217, 138, 115, 0.1); border-color: var(--wrong-color); color: var(--wrong-color); }
.btn-again:hover { background: rgba(217, 138, 115, 0.2); }
.btn-know { background: rgba(127, 214, 194, 0.12); border-color: #7fd6c2; color: #7fd6c2; }
.btn-know:hover { background: rgba(127, 214, 194, 0.22); }

.tap-hint { font-size: 0.72rem; color: #5c6f96; }

.next-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  color: var(--dark-color);
  font-family: var(--font-main);
  font-weight: 700; font-size: 0.9rem;
  padding: 0.9rem; border: none; border-radius: 12px; cursor: pointer;
  transition: filter 0.2s ease;
}
.next-btn:hover:not(:disabled) { filter: brightness(1.1); }
.next-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- Satzbau-Modus ---------- */
.satzbau-translation {
  font-family: var(--font-heading);
  font-style: italic;
  font-size: 0.95rem;
  color: #9fb0d4;
  max-width: 480px;
  position: relative;
  padding: 0 1.6rem;
}
.satzbau-translation::before, .satzbau-translation::after {
  font-family: var(--font-heading);
  color: var(--primary-color);
  opacity: 0.7;
  font-size: 1.3rem;
  position: absolute;
  line-height: 1;
}
.satzbau-translation::before { content: "“"; left: 0; top: 0.1rem; }
.satzbau-translation::after { content: "”"; right: 0; bottom: -0.3rem; }

.sentence-plaque {
  position: relative;
  width: 100%;
  padding: 1.9rem 1.4rem 1.6rem;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(229, 186, 115, 0.07), rgba(229, 186, 115, 0.02));
  border-top: 1px solid rgba(229, 186, 115, 0.35);
  border-bottom: 1px solid rgba(229, 186, 115, 0.35);
}
.sentence-plaque::before {
  content: "";
  position: absolute;
  top: -5px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 8px; height: 8px;
  background: var(--dark-color);
  border-top: 1px solid rgba(229, 186, 115, 0.6);
  border-left: 1px solid rgba(229, 186, 115, 0.6);
}

.word-row {
  display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center;
  direction: rtl; width: 100%;
}
.word-static {
  font-family: var(--font-arabic); font-size: 1.4rem; color: #6b7c9e;
  padding: 0.95rem 0.4rem; display: flex; align-items: center;
}
.word-btn {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-light);
  padding: 0.9rem 1.2rem 0.75rem;
  border-radius: 10px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  position: relative;
}
.word-btn .w-text { font-family: var(--font-arabic); font-size: 1.45rem; line-height: 1; }
.word-btn .w-role {
  font-family: var(--font-main); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--accent-color);
  text-transform: uppercase; font-weight: 700; padding-top: 0.15rem; border-top: 1px solid currentColor; opacity: 0.9;
}
.word-btn:hover:not(:disabled) { border-color: var(--primary-color); background: rgba(229, 186, 115, 0.1); transform: translateY(-2px); }
.word-btn.selected { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(229, 186, 115, 0.3), 0 8px 18px rgba(229, 186, 115, 0.12); transform: translateY(-2px); }
.word-btn.correct { background: rgba(127, 214, 194, 0.15); border-color: #7fd6c2; }
.word-btn.wrong { background: rgba(217, 138, 115, 0.15); border-color: var(--wrong-color); }

.role-row { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
.role-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  color: var(--text-light);
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.83rem;
  padding: 0.55rem 1.05rem 0.55rem 0.8rem;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.role-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.role-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.2); }
.role-btn:disabled { cursor: default; opacity: 0.55; }

.progress-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1.75rem; }
.progress-track { flex: 1; height: 8px; background: rgba(255, 255, 255, 0.06); border-radius: 99px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.07); }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--secondary-color), var(--primary-color)); border-radius: 99px; transition: width 0.35s ease; }
.progress-label { font-size: 0.75rem; color: #5c6f96; white-space: nowrap; }
.star-mark { width: 14px; height: 14px; flex-shrink: 0; }

.controls { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.ghost-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #9fb0d4;
  font-family: var(--font-main);
  font-size: 0.78rem;
  padding: 0.6rem 1.1rem;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.ghost-btn:hover { border-color: var(--primary-color); color: var(--accent-color); }

footer {
  text-align: center;
  padding: 2.5rem 1rem 1rem;
  margin-top: 1rem;
  font-size: 0.78rem;
  color: #7d8bab;
  line-height: 1.8;
  position: relative;
  z-index: 10;
}
footer .made-by { opacity: 0.85; }
footer .made-by a { color: var(--accent-color); text-decoration: none; font-weight: 600; }
footer .made-by a:hover { text-decoration: underline; }

kbd {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.75em;
  color: var(--text-color);
}

@media (max-width: 640px) {
  body { padding-bottom: 3rem; }
  header { padding: 3.5rem 1rem 1rem; }
  .header-star { width: 62px; height: 62px; margin-bottom: 12px; }
  h1 { font-size: 1.85rem; }
  header .ar-sub { font-size: 1.05rem; }
  header p.subtitle { font-size: 0.8rem; }
  main { padding: 0 0.85rem; }
  .stats-row { gap: 0.5rem; }
  .stats-pill { font-size: 0.72rem; }
  .stats-pill div { padding: 0.5rem 0.7rem; }
  .icon-btn { width: 36px; height: 36px; font-size: 0.9rem; }
  .pill-row { gap: 0.5rem; }
  .pill-group { width: 100%; justify-content: center; flex-wrap: wrap; }
  .pill-btn { flex: 1 1 auto; padding: 0.55rem 0.7rem; font-size: 0.75rem; }
  #lesson-tabs { width: 100%; justify-content: center; flex-wrap: wrap; }
  .card { padding: 2.2rem 1.25rem; min-height: 250px; gap: 1.1rem; }
  .concept-term { font-size: 1.25rem; }
  .grammar-question { font-size: 1rem; }
  .mc-grid, .tf-grid { max-width: 100%; }
  .opt-btn { font-size: 0.88rem; padding: 0.8rem 0.6rem; }
  .sentence-plaque { padding: 1.5rem 0.9rem 1.3rem; }
  .word-btn { padding: 0.75rem 0.9rem 0.65rem; }
  .word-btn .w-text { font-size: 1.25rem; }
  .role-btn { font-size: 0.78rem; padding: 0.5rem 0.9rem 0.5rem 0.75rem; }

<script>
/* Die Inhalte (SATZANALYSE, SATZANALYSE_LABELS) kommen aus main.js —
   siehe <script src="main.js"> im <head>. */
const STORAGE_KEY = "satzanalyse_progress_v1";
const SOUND_KEY = "satzanalyse_sound_muted";
const MASTER_THRESHOLD = 3;

const ARABIC_REGEX = /[\u0600-\u06FF]/;
function isArabicText(t){ return ARABIC_REGEX.test(t || ""); }

/* ---------- Lektionen ---------- */
let selectedLesson = "alle";
function lessonList(){
  if(selectedLesson === "alle") return Object.values(SATZANALYSE);
  const orderedKeys = Object.keys(SATZANALYSE).sort(lessonKeySort);
  const idx = orderedKeys.indexOf(selectedLesson);
  const keysUpToHere = idx === -1 ? [selectedLesson] : orderedKeys.slice(0, idx + 1);
  return keysUpToHere.map(k => SATZANALYSE[k]).filter(Boolean);
}
function currentDeck(){
  const items = [];
  lessonList().forEach(l => {
    (l.concepts || []).forEach(c => items.push({ kind: "concept", key: "c:" + c.term, term: c.term, explanation: c.explanation }));
    (l.questions || []).forEach(q => items.push({ kind: q.type, key: (q.type === "mc" ? "q:" + q.question : "t:" + q.statement), ...q }));
    (l.sentences || []).forEach(s => items.push({ kind: "satzbau", key: "s:" + s.words.map(w => w.text).join("|"), words: s.words, translation: s.translation }));
  });
  if(mode === "mix") return items;
  return items.filter(i => i.kind === mode);
}

/* ---------- Sound-Engine ---------- */
const Sound = (() => {
  let ctx = null;
  let muted = localStorage.getItem(SOUND_KEY) === "1";
  let combo = 0;

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type="sine", gainPeak=0.16, opts={}){
    if(muted) return;
    const c = ensureCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = opts.cutoff || 4200;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    if(opts.slideTo){
      osc.frequency.linearRampToValueAtTime(opts.slideTo, c.currentTime + start + dur);
    }
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + start + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(filter).connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.03);
  }

  return {
    click(){ tone(660, 0, 0.045, "triangle", 0.05, {cutoff: 3000}); },
    flip(){ tone(520, 0, 0.05, "triangle", 0.07); tone(780, 0.05, 0.08, "sine", 0.06); },
    correct(){
      combo = Math.min(combo + 1, 7);
      const step = Math.pow(2, combo / 12);
      tone(523.25 * step, 0,    0.11, "sine", 0.17);
      tone(659.25 * step, 0.05, 0.13, "sine", 0.13);
      tone(783.99 * step, 0.1,  0.18, "sine", 0.11);
    },
    wrong(){
      combo = 0;
      tone(233, 0,    0.16, "sine", 0.11, {slideTo: 180, cutoff: 1400});
      tone(174, 0.03, 0.2,  "sine", 0.08, {cutoff: 1200});
    },
    mastered(){
      combo = 0;
      tone(523.25, 0,    0.12, "sine", 0.15);
      tone(659.25, 0.08, 0.12, "sine", 0.15);
      tone(783.99, 0.16, 0.14, "sine", 0.15);
      tone(1046.5, 0.26, 0.32, "sine", 0.17);
      tone(1318.5, 0.3,  0.28, "sine", 0.09);
    },
    isMuted(){ return muted; },
    toggle(){
      muted = !muted;
      localStorage.setItem(SOUND_KEY, muted ? "1" : "0");
      if(!muted) this.click();
      return muted;
    }
  };
})();

let progress = loadProgress();
let mode = "satzbau";
let currentItem = null;
let sessionCorrect = 0, sessionTotal = 0;
let cardEl = document.getElementById("card");
let sessionWrongKeys = new Set();
let reviewQueue = [];
let inReview = false;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function getEntry(item){
  if(!progress[item.key]) progress[item.key] = { streak: 0, wrong: 0 };
  return progress[item.key];
}
function isMastered(item){
  return getEntry(item).streak >= MASTER_THRESHOLD;
}
function markResult(item, correct){
  const e = getEntry(item);
  const wasMastered = e.streak >= MASTER_THRESHOLD;
  if(correct){ e.streak += 1; } else { e.streak = 0; e.wrong += 1; }
  const justMastered = !wasMastered && e.streak >= MASTER_THRESHOLD;
  saveProgress();
  sessionTotal++; if(correct) sessionCorrect++;

  if(!correct){
    sessionWrongKeys.add(item.key);
    if(inReview && !reviewQueue.find(w => w.key === item.key)) reviewQueue.push(item);
  } else if(sessionWrongKeys.has(item.key)){
    sessionWrongKeys.delete(item.key);
    reviewQueue = reviewQueue.filter(w => w.key !== item.key);
  }

  if(justMastered) Sound.mastered();
  else if(correct) Sound.correct();
  else Sound.wrong();

  updateStats();
}

function updateStats(){
  const deck = currentDeck();
  document.getElementById("stat-total").innerText = deck.length;
  const masteredCount = deck.filter(isMastered).length;
  document.getElementById("stat-session").innerText = `${sessionCorrect}/${sessionTotal}`;
  const progressCount = deck.filter(item => getEntry(item).streak > 0).length;
  const pct = deck.length ? Math.round((progressCount / deck.length) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  if(pct === 100 && deck.length > 0){
    document.getElementById("progress-label").innerText = pct + " % — Alles gemeistert!";
    if(sessionWrongKeys.size > 0 && !inReview){
      startReviewRound();
    } else if(!window.__endShownFor || window.__endShownFor !== (selectedLesson + mode)){
      window.__endShownFor = selectedLesson + mode;
      try{ showEndOverlay(); }catch(e){}
    }
  } else {
    document.getElementById("progress-label").innerText = pct + " % bearbeitet";
    try{ hideEndOverlay(); }catch(e){}
  }
  document.getElementById("stat-mastered").innerText = `${masteredCount}/${deck.length}`;
}

function showEndOverlay(){
  const overlay = document.getElementById("end-overlay");
  const msg = document.getElementById("end-message");
  const label = selectedLesson === "alle" ? "allen Lektionen" : ((typeof SATZANALYSE_LABELS !== "undefined" && SATZANALYSE_LABELS[selectedLesson]) || `Lektion ${selectedLesson}`);
  msg.innerText = `Du hast alles in ${label} erfolgreich gelernt.`;
  overlay.classList.add("show"); overlay.setAttribute("aria-hidden","false");
}
function hideEndOverlay(){
  const overlay = document.getElementById("end-overlay");
  if(overlay){ overlay.classList.remove("show"); overlay.setAttribute("aria-hidden","true"); }
}
function replayLesson(){
  currentDeck().forEach(item => { const e = getEntry(item); e.streak = 0; e.wrong = 0; });
  saveProgress();
  window.__endShownFor = null;
  hideEndOverlay();
  updateStats();
  nextCard();
}
function backToAll(){
  selectedLesson = "alle";
  buildLessonTabs();
  window.__endShownFor = null;
  hideEndOverlay();
  updateScopeHint();
  updateStats();
  nextCard();
}
document.addEventListener("click", e => {
  if(e.target && e.target.id === "end-replay") replayLesson();
  if(e.target && e.target.id === "end-back") backToAll();
  if(e.target && e.target.id === "end-close") hideEndOverlay();
});

function weightedPick(list){
  const weights = list.map(item => {
    const e = getEntry(item);
    return Math.max(1, (e.wrong + 1) * 3 - e.streak);
  });
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<list.length;i++){
    r -= weights[i];
    if(r <= 0) return list[i];
  }
  return list[list.length-1];
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ---------- Lektionen-Auswahl ---------- */
/* Natürliche Sortierung: unterstützt reine Zahlen ("1", "12") ebenso wie
   Zahl+Buchstabe-Kombinationen ("9a", "14b") für Lektionsteile wie 9A/9B. */
function lessonKeySort(a, b){
  const pa = a.match(/^(\d+)(.*)$/) || [null, "0", a];
  const pb = b.match(/^(\d+)(.*)$/) || [null, "0", b];
  const na = Number(pa[1]), nb = Number(pb[1]);
  if(na !== nb) return na - nb;
  return String(pa[2]).localeCompare(String(pb[2]));
}

function updateScopeHint(){
  const hintEl = document.getElementById("scope-hint");
  if(!hintEl) return;
  if(selectedLesson === "alle"){
    hintEl.innerHTML = "Übt Sätze aus <b>allen Lektionen</b> gemischt.";
    return;
  }
  const orderedKeys = Object.keys(SATZANALYSE).sort(lessonKeySort);
  const idx = orderedKeys.indexOf(selectedLesson);
  const included = idx === -1 ? [selectedLesson] : orderedKeys.slice(0, idx + 1);
  const labels = included.map(k => (SATZANALYSE_LABELS[k] || `Lektion ${k}`).replace("Lektion ", ""));
  if(labels.length <= 1){
    hintEl.innerHTML = `Übt nur <b>Lektion ${labels[0]}</b>.`;
  } else {
    hintEl.innerHTML = `Kumulativ: übt <b>Lektion ${labels[0]}–${labels[labels.length-1]}</b> zusammen.`;
  }
}

function buildLessonTabs(){
  const wrap = document.getElementById("lesson-tabs");
  wrap.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "lesson-pill" + (selectedLesson === "alle" ? " active" : "");
  allBtn.textContent = "Alle";
  allBtn.dataset.key = "alle";
  wrap.appendChild(allBtn);

  Object.keys(SATZANALYSE).sort(lessonKeySort).forEach(key => {
    const l = SATZANALYSE[key];
    const hasContent = (l.concepts && l.concepts.length) || (l.questions && l.questions.length);
    const btn = document.createElement("button");
    btn.className = "lesson-pill" + (hasContent ? "" : " disabled") + (selectedLesson === key ? " active" : "");
    btn.textContent = (typeof SATZANALYSE_LABELS !== "undefined" && SATZANALYSE_LABELS[key]) || `Lektion ${key}`;
    btn.dataset.key = key;
    if(!hasContent) btn.title = "noch keine Inhalte in dieser Lektion";
    wrap.appendChild(btn);
  });

  wrap.addEventListener("click", e => {
    const btn = e.target.closest(".lesson-pill");
    if(!btn || btn.classList.contains("disabled")) return;
    Sound.click();
    selectedLesson = btn.dataset.key;
    [...wrap.children].forEach(b => b.classList.toggle("active", b === btn));
    window.__endShownFor = null;
    updateScopeHint();
    updateStats();
    nextCard();
  });
}

function nextCard(){
  const deck = currentDeck();
  if(deck.length === 0){
    const label = selectedLesson === "alle" ? "Inhalte" : `Lektion ${selectedLesson}`;
    cardEl.innerHTML = `<div class="empty-state"><div class="big">Noch keine ${label} hinterlegt.</div>Trage Konzepte/Fragen in <kbd>main.js</kbd> in der passenden Lektion ein.</div>`;
    return;
  }
  if(inReview){
    if(reviewQueue.length === 0){
      inReview = false;
      sessionWrongKeys.clear();
      try{ showEndOverlay(); }catch(e){}
      return;
    }
    currentItem = reviewQueue.shift();
  } else {
    currentItem = weightedPick(deck);
  }
  if(currentItem.kind === "concept") renderConcept();
  else if(currentItem.kind === "mc") renderMC();
  else if(currentItem.kind === "satzbau") renderSatzbau();
  else renderTrueFalse();
}

function startReviewRound(){
  const deck = currentDeck();
  reviewQueue = [];
  sessionWrongKeys.forEach(k => {
    const item = deck.find(x => x.key === k);
    if(item) reviewQueue.push(item);
  });
  if(reviewQueue.length === 0){ sessionWrongKeys.clear(); inReview = false; return; }
  reviewQueue = shuffle(reviewQueue);
  inReview = true;
  hideEndOverlay();
  document.getElementById("progress-label").innerText = `Wiederhole falsch beantwortete Punkte (${reviewQueue.length})`;
  nextCard();
}

function renderConcept(){
  const item = currentItem;
  cardEl.innerHTML = `
    <div class="prompt-hint">Begriff — antippen zum Umdrehen</div>
    <div id="concept-face" class="concept-term" style="cursor:pointer;">${item.term}</div>
    <div class="tap-hint">Leertaste oder Klick zum Umdrehen</div>
    <div id="flash-actions" class="flash-actions" style="display:none;">
      <button class="btn-again" id="btn-again">✗ Nochmal</button>
      <button class="btn-know" id="btn-know">✓ Kenn ich</button>
    </div>
  `;
  const face = document.getElementById("concept-face");
  const actions = document.getElementById("flash-actions");
  function flip(){
    Sound.flip();
    face.innerText = item.explanation;
    face.className = "concept-explanation";
    actions.style.display = "flex";
    document.removeEventListener("keydown", flipHandler);
  }
  function flipHandler(e){ if(e.code === "Space"){ e.preventDefault(); flip(); } }
  face.onclick = flip;
  document.addEventListener("keydown", flipHandler);

  setTimeout(() => {
    const again = document.getElementById("btn-again");
    const know = document.getElementById("btn-know");
    if(again) again.onclick = () => { if(actions.style.display !== "none"){ markResult(currentItem, false); nextCard(); } };
    if(know) know.onclick = () => { if(actions.style.display !== "none"){ markResult(currentItem, true); nextCard(); } };
  }, 0);
}

function renderMC(){
  const item = currentItem;
  const questionHtml = item.question;
  cardEl.innerHTML = `
    <div class="prompt-hint">Multiple Choice</div>
    <div class="grammar-question">${questionHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="explain-text" id="explain" style="display:none;"></div>
    <div class="mc-grid" id="mc-grid"></div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Frage ➔</button>
  `;
  const grid = document.getElementById("mc-grid");
  item.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (isArabicText(choice) ? " ar" : "");
    btn.innerHTML = choice;
    btn.dataset.choice = choice;
    btn.onclick = () => selectMC(choice, btn, item.correct, item.explanation);
    grid.appendChild(btn);
  });
  document.getElementById("next-btn").onclick = nextCard;
}

function selectMC(choice, btn, correctAnswer, explanation){
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const explainEl = document.getElementById("explain");
  const correct = choice === correctAnswer;
  markResult(currentItem, correct);
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctAnswer}`;
    feedback.className = "feedback bad";
    buttons.forEach(b => { if(b.dataset.choice === correctAnswer) b.classList.add("correct"); });
  }
  if(explanation){ explainEl.innerText = explanation; explainEl.style.display = "block"; }
  document.getElementById("next-btn").style.display = "block";
}

function renderTrueFalse(){
  const item = currentItem;
  cardEl.innerHTML = `
    <div class="prompt-hint">Richtig oder Falsch?</div>
    <div class="grammar-question">${item.statement}</div>
    <div class="feedback" id="feedback"></div>
    <div class="explain-text" id="explain" style="display:none;"></div>
    <div class="tf-grid" id="tf-grid">
      <button class="tf-btn" id="tf-true">Wahr</button>
      <button class="tf-btn" id="tf-false">Falsch</button>
    </div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Frage ➔</button>
  `;
  document.getElementById("tf-true").onclick = (e) => selectTF(true, e.target, item.correct, item.explanation);
  document.getElementById("tf-false").onclick = (e) => selectTF(false, e.target, item.correct, item.explanation);
  document.getElementById("next-btn").onclick = nextCard;
}

function selectTF(choice, btn, correctAnswer, explanation){
  const buttons = document.querySelectorAll(".tf-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const explainEl = document.getElementById("explain");
  const correct = choice === correctAnswer;
  markResult(currentItem, correct);
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctAnswer ? "Wahr" : "Falsch"}`;
    feedback.className = "feedback bad";
    document.getElementById(correctAnswer ? "tf-true" : "tf-false").classList.add("correct");
  }
  if(explanation){ explainEl.innerText = explanation; explainEl.style.display = "block"; }
  document.getElementById("next-btn").style.display = "block";
}

/* ---------- Satzbau-Modus: mehrstufige Satzanalyse ---------- */
let satzbauState = null;

/* Feste Farbzuordnung je Grammatik-Rolle, damit z. B. Mubtada immer gold
   und Khabar immer türkis erscheint — konsistent über alle Lektionen. */
const ROLE_COLORS = {
  "Mubtada": "#e5ba73",
  "Khabar": "#7fd6c2",
  "Mudaf": "#7fa8e8",
  "Mudaf ilaihi": "#c98af0",
  "Na't": "#f0a8c9",
  "Man'ut": "#9ee87a",
  "Harful Jarr": "#f0935a",
  "Majrur": "#f0e07a",
  "Marfu": "#c9a878",
  "Mudhakkar": "#8fb8e0",
  "Muannath": "#e0a8d4",
  "Bestimmt": "#a8c9e0",
  "Unbestimmt": "#e0c9a8"
};
/* Anzeigename inkl. arabischem Original — wird für Rollen-Buttons und
   zugewiesene Wort-Badges verwendet. Der kurze Schlüssel (links) bleibt
   die interne, stabile Kennung für Logik/Datenabgleich. */
const ROLE_LABELS = {
  "Mubtada": "Mubtada (مبتدأ)",
  "Khabar": "Khabar (خبر)",
  "Mudaf": "Mudaf (مضاف)",
  "Mudaf ilaihi": "Mudaf ilaihi (مضاف إليه)",
  "Na't": "Na't (نعت)",
  "Man'ut": "Man'ut (منعوت)",
  "Harful Jarr": "Harful-Jarr (حرف جر)",
  "Majrur": "Majrur (مجرور)",
  "Marfu": "Marfû' (مرفوع)",
  "Mudhakkar": "Mudhakkar (مذكر)",
  "Muannath": "Mu'annath (مؤنث)",
  "Bestimmt": "Bestimmt (معرفة)",
  "Unbestimmt": "Unbestimmt (نكرة)"
};
const ROLE_FALLBACK_PALETTE = ["#e5ba73", "#7fd6c2", "#7fa8e8", "#c98af0", "#f0a8c9", "#9ee87a", "#f0935a", "#f0e07a"];
function roleColor(role, idx){
  return ROLE_COLORS[role] || ROLE_FALLBACK_PALETTE[(idx || 0) % ROLE_FALLBACK_PALETTE.length];
}
function roleLabel(role){
  return ROLE_LABELS[role] || role;
}
function hexToRgba(hex, alpha){
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* Jedes Wort trägt jetzt tags:{ebene: Rolle} statt einer einzelnen role.
   Fehlt eine Ebene bei einem Wort, ist es in dieser Runde nicht anklickbar
   (entweder ein Füllwort wie وَ, oder auf dieser Ebene bereits geklärt). */
function wordTag(word, level){
  return word.tags ? word.tags[level] : undefined;
}
/* Nur Ebenen mit echter Auswahl liefern (mindestens 2 unterschiedliche
   Rollen). Ebenen, bei denen wegen einer grammatischen Übereinstimmungsregel
   ohnehin nur ein Wert infrage kommt (z. B. Geschlecht/Bestimmtheit bei
   Na't+Man'ut, die per Definition immer übereinstimmen), wären kein echtes
   Rätsel — die werden hier übersprungen. */
function usableLevels(item){
  const raw = (() => {
    let max = 1;
    item.words.forEach(w => { if(w.tags){ Object.keys(w.tags).forEach(k => { max = Math.max(max, Number(k)); }); } });
    return max;
  })();
  const list = [];
  for(let lvl = 1; lvl <= raw; lvl++){
    const roles = new Set(item.words.map(w => wordTag(w, lvl)).filter(r => r !== undefined));
    if(roles.size >= 2) list.push(lvl);
  }
  return list.length ? list : [1];
}

function renderSatzbau(){
  const item = currentItem;
  satzbauState = {
    words: item.words,
    levels: usableLevels(item),
    levelIndex: 0,
    assignments: {},
    selected: null,
    checked: false,
    overallCorrect: true
  };
  renderSatzbauLevel();
}

function renderSatzbauLevel(){
  const item = currentItem;
  const level = satzbauState.levels[satzbauState.levelIndex];
  satzbauState.assignments[level] = new Array(item.words.length).fill(null);
  satzbauState.selected = null;
  satzbauState.checked = false;

  const roles = [...new Set(item.words.map(w => wordTag(w, level)).filter(r => r !== undefined))];
  const levelHint = satzbauState.levels.length > 1
    ? `<div class="level-hint">Ebene ${satzbauState.levelIndex + 1} von ${satzbauState.levels.length} — ${roles.map(roleLabel).join(" · ")}</div>`
    : "";

  cardEl.innerHTML = `
    <div class="prompt-hint">Wort antippen, dann Rolle wählen</div>
    ${levelHint}
    ${item.translation ? `<div class="satzbau-translation">${item.translation}</div>` : ""}
    <div class="sentence-plaque"><div class="word-row" id="word-row"></div></div>
    <div class="role-row" id="role-row"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="check-btn" disabled>Prüfen</button>
  `;
  const wordRow = document.getElementById("word-row");
  item.words.forEach((w, i) => {
    const tag = wordTag(w, level);
    if(tag === undefined){
      const span = document.createElement("div");
      span.className = "word-static";
      span.innerText = w.text;
      wordRow.appendChild(span);
    } else {
      const btn = document.createElement("button");
      btn.className = "word-btn";
      btn.innerHTML = `<span class="w-text">${w.text}</span>`;
      btn.dataset.index = i;
      btn.onclick = () => selectWord(i);
      wordRow.appendChild(btn);
    }
  });
  const roleRow = document.getElementById("role-row");
  roles.forEach((r, idx) => {
    const color = roleColor(r, idx);
    const btn = document.createElement("button");
    btn.className = "role-btn";
    btn.innerHTML = `<span class="dot"></span><span>${roleLabel(r)}</span>`;
    btn.dataset.role = r;
    btn.dataset.color = color;
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.onclick = () => assignRole(r);
    roleRow.appendChild(btn);
  });
  document.getElementById("check-btn").onclick = checkSatzbau;
}

function refreshRoleHighlight(){
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  const assignedHere = satzbauState.selected !== null ? satzbauState.assignments[lvl][satzbauState.selected] : null;
  document.querySelectorAll("#role-row .role-btn").forEach(b => {
    const isActive = b.dataset.role === assignedHere;
    b.style.background = isActive ? hexToRgba(b.dataset.color, 0.18) : "rgba(255, 255, 255, 0.03)";
    b.style.boxShadow = isActive ? `0 0 0 2px ${hexToRgba(b.dataset.color, 0.35)}` : "none";
  });
}

function selectWord(i){
  if(satzbauState.checked) return;
  Sound.click();
  satzbauState.selected = i;
  document.querySelectorAll("#word-row .word-btn").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.index) === i);
  });
  refreshRoleHighlight();
}

function assignRole(role){
  if(satzbauState.checked || satzbauState.selected === null) return;
  Sound.click();
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  const i = satzbauState.selected;
  satzbauState.assignments[lvl][i] = role;
  const btn = document.querySelector(`#word-row .word-btn[data-index="${i}"]`);
  if(btn){
    const roleBtn = document.querySelector(`#role-row .role-btn[data-role="${CSS.escape(role)}"]`);
    const c = roleBtn ? roleBtn.dataset.color : roleColor(role, 0);
    btn.innerHTML = `<span class="w-text">${satzbauState.words[i].text}</span><span class="w-role" style="color:${c}">${roleLabel(role)}</span>`;
    btn.style.borderColor = c;
  }
  refreshRoleHighlight();
  const taggable = satzbauState.words
    .map((w, idx) => ({ w, idx }))
    .filter(o => wordTag(o.w, lvl) !== undefined);
  const allAssigned = taggable.every(o => satzbauState.assignments[lvl][o.idx]);
  document.getElementById("check-btn").disabled = !allAssigned;
}

function checkSatzbau(){
  const item = currentItem;
  if(satzbauState.checked){
    if(satzbauState.levelIndex < satzbauState.levels.length - 1){
      satzbauState.levelIndex++;
      renderSatzbauLevel();
    } else {
      markResult(item, satzbauState.overallCorrect);
      nextCard();
    }
    return;
  }
  satzbauState.checked = true;
  const lvl = satzbauState.levels[satzbauState.levelIndex];
  let levelCorrect = true;
  satzbauState.words.forEach((w, i) => {
    const tag = wordTag(w, lvl);
    if(tag === undefined) return;
    const btn = document.querySelector(`#word-row .word-btn[data-index="${i}"]`);
    const correct = satzbauState.assignments[lvl][i] === tag;
    if(!correct){
      levelCorrect = false;
      if(btn) btn.innerHTML = `<span class="w-text">${w.text}</span><span class="w-role">${roleLabel(tag)}</span>`;
    }
    if(btn){
      btn.classList.add(correct ? "correct" : "wrong");
      btn.style.borderColor = "";
      const roleSpan = btn.querySelector(".w-role");
      if(roleSpan) roleSpan.style.color = correct ? "#7fd6c2" : "#d98a73";
    }
  });
  satzbauState.overallCorrect = satzbauState.overallCorrect && levelCorrect;
  document.querySelectorAll("#role-row .role-btn").forEach(b => b.disabled = true);
  document.querySelectorAll("#word-row .word-btn").forEach(b => b.onclick = null);
  const feedback = document.getElementById("feedback");
  if(levelCorrect){
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
  } else {
    feedback.innerText = "Nicht ganz — die richtige Zuordnung ist jetzt markiert.";
    feedback.className = "feedback bad";
  }
  const checkBtn = document.getElementById("check-btn");
  checkBtn.innerText = satzbauState.levelIndex < satzbauState.levels.length - 1 ? "Nächste Ebene ➔" : "Nächste Frage ➔";
  checkBtn.disabled = false;
}

document.getElementById("shuffle-btn").addEventListener("click", () => { Sound.click(); nextCard(); });
document.getElementById("reset-progress-btn").addEventListener("click", () => {
  if(confirm("Gesamten Fortschritt zurücksetzen?")){
    progress = {};
    saveProgress();
    sessionCorrect = 0; sessionTotal = 0;
    updateStats();
    nextCard();
  }
});
const soundBtn = document.getElementById("sound-toggle");
function refreshSoundBtn(){ soundBtn.innerText = Sound.isMuted() ? "🔇" : "🔊"; }
soundBtn.addEventListener("click", () => { Sound.toggle(); refreshSoundBtn(); });
refreshSoundBtn();

// Init
if (typeof SATZANALYSE === "undefined") {
  cardEl.innerHTML = `<div class="empty-state"><div class="big">main.js wurde nicht geladen.</div>Prüfe, ob <kbd>main.js</kbd> im selben Ordner liegt und <kbd>const SATZANALYSE = {...}</kbd> enthält.</div>`;
} else {
  buildLessonTabs();
  updateScopeHint();
  updateStats();
  nextCard();
}
</script>
