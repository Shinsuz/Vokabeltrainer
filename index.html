<script>
/* Die Vokabelliste (LESSONS) wird aus vocab.js geladen — siehe <script src="vocab.js">
   im <head>. Diese Datei hier enthält nur die Trainer-Logik. */
const STORAGE_KEY = "vocab_progress_v1";
const SOUND_KEY = "vocab_sound_muted";
const MASTER_THRESHOLD = 3;

/* ---------- Haraket ein-/ausblenden ---------- */
const HARAKAT_REGEX = /[\u064B-\u0652\u0656-\u065F\u0670\u06D6-\u06ED]/g;
function stripHarakat(text){ return text.replace(HARAKAT_REGEX, ""); }
let showHarakat = true;
function displayArabic(text){ return showHarakat ? text : stripHarakat(text); }

/* ---------- Lektionen ---------- */
let selectedLesson = "alle";
function currentDeck(){
  if(selectedLesson === "alle") return Object.values(LESSONS).flat();
  return LESSONS[selectedLesson] || [];
}

/* ---------- Sound-Engine ----------
   synthetisiert per Web Audio, keine Audiodateien nötig.
   Combo-System: richtige Antworten in Folge klingen minimal höher/heller,
   damit sich eine Serie auch akustisch wie ein kleiner Erfolg anfühlt. */
const Sound = (() => {
  let ctx = null;
  let muted = localStorage.getItem(SOUND_KEY) === "1";
  let combo = 0;

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type="sine", gainPeak=0.16, opts={}){
    if(muted) return;
    const c = ensureCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = opts.cutoff || 4200;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    if(opts.slideTo){
      osc.frequency.linearRampToValueAtTime(opts.slideTo, c.currentTime + start + dur);
    }
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + start + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(filter).connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.03);
  }

  return {
    click(){ tone(660, 0, 0.045, "triangle", 0.05, {cutoff: 3000}); },
    flip(){ tone(520, 0, 0.05, "triangle", 0.07); tone(780, 0.05, 0.08, "sine", 0.06); },

    correct(){
      combo = Math.min(combo + 1, 7);
      const step = Math.pow(2, combo / 12); // pro Combo-Stufe einen Halbton höher
      tone(523.25 * step, 0,    0.11, "sine", 0.17);
      tone(659.25 * step, 0.05, 0.13, "sine", 0.13);
      tone(783.99 * step, 0.1,  0.18, "sine", 0.11);
    },

    wrong(){
      combo = 0;
      tone(233, 0,    0.16, "sine", 0.11, {slideTo: 180, cutoff: 1400});
      tone(174, 0.03, 0.2,  "sine", 0.08, {cutoff: 1200});
    },

    mastered(){
      combo = 0;
      tone(523.25, 0,    0.12, "sine", 0.15);
      tone(659.25, 0.08, 0.12, "sine", 0.15);
      tone(783.99, 0.16, 0.14, "sine", 0.15);
      tone(1046.5, 0.26, 0.32, "sine", 0.17);
      tone(1318.5, 0.3,  0.28, "sine", 0.09);
    },

    isMuted(){ return muted; },
    toggle(){
      muted = !muted;
      localStorage.setItem(SOUND_KEY, muted ? "1" : "0");
      if(!muted) this.click();
      return muted;
    }
  };
})();

let progress = loadProgress();
let mode = "flash";
let direction = "ar-de"; // ar-de = Arabisch -> Deutsch, de-ar = Deutsch -> Arabisch
let currentWord = null;
let sessionCorrect = 0, sessionTotal = 0;
let cardEl = document.getElementById("card");
// Session review queue: track words answered wrong this session
let sessionWrongKeys = new Set(); // store arabic keys
let reviewQueue = [];
let inReview = false;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function getEntry(word){
  if(!progress[word.arabic]) progress[word.arabic] = { streak: 0, wrong: 0 };
  return progress[word.arabic];
}
function isMastered(word){
  return getEntry(word).streak >= MASTER_THRESHOLD;
}
function markResult(word, correct){
  const e = getEntry(word);
  const wasMastered = e.streak >= MASTER_THRESHOLD;
  if(correct){ e.streak += 1; } else { e.streak = 0; e.wrong += 1; }
  const justMastered = !wasMastered && e.streak >= MASTER_THRESHOLD;
  saveProgress();
  sessionTotal++; if(correct) sessionCorrect++;

  // Manage session wrong list / review queue
  if(!correct){
    sessionWrongKeys.add(word.arabic);
    // if currently in review, ensure the word is queued
    if(inReview && !reviewQueue.find(w => w.arabic === word.arabic)){
      reviewQueue.push(word);
    }
  } else {
    // on correct, remove from pending wrongs (if present)
    if(sessionWrongKeys.has(word.arabic)){
      sessionWrongKeys.delete(word.arabic);
      // also remove from reviewQueue if present
      reviewQueue = reviewQueue.filter(w => w.arabic !== word.arabic);
    }
  }

  const hadJustMastered = justMastered;
  if(hadJustMastered) Sound.mastered();
  else if(correct) Sound.correct();
  else Sound.wrong();

  updateStats();
}

function updateStats(){
  const deck = currentDeck();
  document.getElementById("stat-total").innerText = deck.length;
  const masteredCount = deck.filter(isMastered).length;
  document.getElementById("stat-mastered").innerText = masteredCount;
  document.getElementById("stat-session").innerText = `${sessionCorrect}/${sessionTotal}`;
  const progressCount = deck.filter(word => getEntry(word).streak > 0).length;
  const pct = deck.length ? Math.round((progressCount / deck.length) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  if(pct === 100 && deck.length > 0){
    document.getElementById("progress-label").innerText = pct + " % — Alles gemeistert!";
    // If there are wrong answers this session, start a focused review round first
    if(sessionWrongKeys.size > 0 && !inReview){
      startReviewRound();
    } else {
      if(!window.__endShownFor || window.__endShownFor !== selectedLesson){
        window.__endShownFor = selectedLesson;
        try{ showEndOverlay(deck); }catch(e){}
        try{ Sound.mastered(); }catch(e){}
      }
    }
  } else {
    document.getElementById("progress-label").innerText = pct + " % bearbeitet";
    try{ hideEndOverlay(); }catch(e){}
  }
  document.getElementById("stat-mastered").innerText = `${masteredCount}/${deck.length}`;
}

/* ---------- End-Screen / Overlay Logik ---------- */
function showEndOverlay(deck){
  const overlay = document.getElementById('end-overlay');
  const msg = document.getElementById('end-message');
  const title = document.getElementById('end-title');
  const label = selectedLesson === 'alle' ? 'allen Lektionen' : ((typeof LESSON_LABELS !== 'undefined' && LESSON_LABELS[selectedLesson]) || `Lektion ${selectedLesson}`);
  title.innerText = 'Alles gemeistert!';
  msg.innerText = `Du hast alle Vokabeln in ${label} erfolgreich gelernt.`;
  overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
}

function hideEndOverlay(){
  const overlay = document.getElementById('end-overlay');
  if(overlay){ overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true'); }
}

function replayLesson(){
  const deck = currentDeck();
  deck.forEach(w => { const e = getEntry(w); e.streak = 0; e.wrong = 0; });
  saveProgress();
  window.__endShownFor = null;
  hideEndOverlay();
  updateStats();
  nextCard();
}

function backToAll(){
  selectedLesson = 'alle';
  buildLessonTabs();
  window.__endShownFor = null;
  hideEndOverlay();
  updateStats();
  nextCard();
}

// Overlay button listeners
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'end-replay') replayLesson();
  if(e.target && e.target.id === 'end-back') backToAll();
  if(e.target && e.target.id === 'end-close') hideEndOverlay();
});

function scheduleNextCard(delay = 850){
  clearTimeout(window.__vocabAdvanceTimer);
  window.__vocabAdvanceTimer = window.setTimeout(() => nextCard(), delay);
}

function weightedPick(list){
  const weights = list.map(w => {
    const e = getEntry(w);
    return Math.max(1, (e.wrong + 1) * 3 - e.streak);
  });
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<list.length;i++){
    r -= weights[i];
    if(r <= 0) return list[i];
  }
  return list[list.length-1];
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function setMode(m){
  mode = m;
  document.querySelectorAll("#tabs .pill-btn").forEach(t => t.classList.toggle("active", t.dataset.mode === m));
  nextCard();
}

function toggleDirection(){
  direction = direction === "ar-de" ? "de-ar" : "ar-de";
  const label = document.getElementById("dir-label");
  label.innerHTML = direction === "ar-de" ? "<b>عربي</b> → Deutsch" : "<b>Deutsch</b> → عربي";
  nextCard();
}

function activeModeForRound(){
  if(mode !== "mix") return mode;
  const pool = ["flash","mc","write"];
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------- Lektionen-Auswahl ---------- */
function buildLessonTabs(){
  const wrap = document.getElementById("lesson-tabs");
  wrap.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "lesson-pill" + (selectedLesson === "alle" ? " active" : "");
  allBtn.textContent = "Alle";
  allBtn.dataset.key = "alle";
  wrap.appendChild(allBtn);

  Object.keys(LESSONS).sort((a,b) => Number(a) - Number(b)).forEach(key => {
    const hasWords = LESSONS[key].length > 0;
    const btn = document.createElement("button");
    btn.className = "lesson-pill" + (hasWords ? "" : " disabled") + (selectedLesson === key ? " active" : "");
    btn.textContent = (typeof LESSON_LABELS !== "undefined" && LESSON_LABELS[key]) || `Lektion ${key}`;
    btn.dataset.key = key;
    if(!hasWords) btn.title = "noch keine Vokabeln in dieser Lektion";
    wrap.appendChild(btn);
  });

  /* onclick statt addEventListener: buildLessonTabs() läuft mehrfach (z. B. bei
     "Zurück zur Übersicht"); sonst würde der Listener jedes Mal doppelt registriert. */
  wrap.onclick = e => {
    const btn = e.target.closest(".lesson-pill");
    if(!btn || btn.classList.contains("disabled")) return;
    Sound.click();
    selectedLesson = btn.dataset.key;
    [...wrap.children].forEach(b => b.classList.toggle("active", b === btn));
    updateStats();
    nextCard();
  };
}

function nextCard(){
  const deck = currentDeck();
  if(deck.length === 0){
    const label = selectedLesson === "alle" ? "Vokabeln" : `Lektion ${selectedLesson}`;
    cardEl.innerHTML = `<div class="empty-state"><div class="big">Noch keine ${label} hinterlegt.</div>Trage sie in <kbd>vocab.js</kbd> in der passenden Lektion ein.</div>`;
    return;
  }
  // If we're in a review round, pull from the reviewQueue
  if(inReview){
    if(reviewQueue.length === 0){
      // review finished
      inReview = false;
      sessionWrongKeys.clear();
      // show end overlay now
      try{ showEndOverlay(deck); }catch(e){}
      return;
    }
    // pop next review item
    currentWord = reviewQueue.shift();
  } else {
    currentWord = weightedPick(deck);
  }
  const roundMode = activeModeForRound();
  if(roundMode === "flash") renderFlash();
  else if(roundMode === "mc") renderMC();
  else renderWrite();
}

function startReviewRound(){
  // build reviewQueue from sessionWrongKeys, keeping current deck order shuffled
  const deck = currentDeck();
  reviewQueue = [];
  sessionWrongKeys.forEach(k => {
    const w = deck.find(x => x.arabic === k) || Object.values(LESSONS).flat().find(x => x.arabic === k);
    if(w) reviewQueue.push(w);
  });
  // fallback: if nothing found, clear
  if(reviewQueue.length === 0){ sessionWrongKeys.clear(); inReview = false; return; }
  // shuffle reviewQueue
  reviewQueue = shuffle(reviewQueue);
  inReview = true;
  // notify user and start first review card
  const overlay = document.getElementById('end-overlay');
  hideEndOverlay();
  // small toast via progress-label
  document.getElementById('progress-label').innerText = `Wiederhole falsch beantwortete Vokabeln (${reviewQueue.length})`;
  nextCard();
}

function frontBack(word){
  if(direction === "ar-de") return { front: displayArabic(word.arabic), back: word.german, frontIsArabic: true };
  return { front: word.german, back: displayArabic(word.arabic), frontIsArabic: false };
}

function renderFlash(){
  const {front, back, frontIsArabic} = frontBack(currentWord);
  cardEl.innerHTML = `
    <div class="prompt-hint">Karteikarte — antippen zum Umdrehen</div>
    <div class="prompt-row-flex">
      <div id="flash-face" class="${frontIsArabic ? 'prompt-word' : 'prompt-word is-german'}" style="cursor:pointer;">${front}</div>
    </div>
    <div class="tap-hint">Leertaste oder Klick zum Umdrehen</div>
    <div id="flash-actions" class="flash-actions" style="display:none;">
      <button class="btn-again" id="btn-again">✗ Nochmal</button>
      <button class="btn-know" id="btn-know">✓ Kenn ich</button>
    </div>
  `;
  const face = document.getElementById("flash-face");
  const actions = document.getElementById("flash-actions");

  function flip(){
    Sound.flip();
    face.innerText = back;
    face.className = frontIsArabic ? "prompt-word is-german" : "prompt-word";
    actions.style.display = "flex";
    document.removeEventListener("keydown", flipHandler);
  }
  function flipHandler(e){ if(e.code === "Space"){ e.preventDefault(); flip(); } }
  face.onclick = flip;
  document.addEventListener("keydown", flipHandler);

  setTimeout(() => {
    const again = document.getElementById("btn-again");
    const know = document.getElementById("btn-know");
    if(again) again.onclick = () => { if(actions.style.display !== "none"){ markResult(currentWord, false); nextCard(); } };
    if(know) know.onclick = () => { if(actions.style.display !== "none"){ markResult(currentWord, true); nextCard(); } };
  }, 0);
}

function renderMC(){
  const {front, back, frontIsArabic} = frontBack(currentWord);
  const pickBackOf = (w) => direction === "ar-de" ? w.german : displayArabic(w.arabic);
  /* Falschantworten zuerst aus dem aktuellen Deck. Hat die Lektion zu wenige
     verschiedene Wörter (z. B. nur 3), wird aus allen Lektionen aufgefüllt —
     jede Liste wird nur einmal durchlaufen, damit es nie in eine Endlosschleife läuft. */
  const choices = [back];
  const addDistractors = list => {
    for(const w of shuffle([...list])){
      if(choices.length >= 4) break;
      const c = pickBackOf(w);
      if(!choices.includes(c)) choices.push(c);
    }
  };
  addDistractors(currentDeck().filter(w => w !== currentWord));
  if(choices.length < 4){
    const padPool = Object.entries(LESSONS)
      .filter(([key]) => selectedLesson === "Grammatik" || key !== "Grammatik")
      .flatMap(([, words]) => words)
      .filter(w => w !== currentWord);
    addDistractors(padPool);
  }
  shuffle(choices);

  cardEl.innerHTML = `
    <div class="prompt-hint">Was bedeutet</div>
    <div class="prompt-row-flex">
      <div class="${frontIsArabic ? 'prompt-word' : 'prompt-word is-german'}">${front}</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="mc-grid" id="mc-grid"></div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Vokabel ➔</button>
  `;

  const grid = document.getElementById("mc-grid");
  choices.forEach((choice) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = choice;
    btn.onclick = () => selectMC(choice, btn, back);
    grid.appendChild(btn);
  });
  document.getElementById("next-btn").onclick = nextCard;
}

function selectMC(choice, btn, correctAnswer){
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById("feedback");
  const correct = choice === correctAnswer;
  markResult(currentWord, correct);
  if(correct){
    btn.classList.add("correct");
    feedback.innerText = "Richtig! 🎉";
    feedback.className = "feedback ok";
    document.getElementById("next-btn").style.display = "none";
    scheduleNextCard();
  } else {
    btn.classList.add("wrong");
    feedback.innerText = `Falsch — richtig wäre: ${correctAnswer}`;
    feedback.className = "feedback bad";
    buttons.forEach(b => { if(b.innerText === correctAnswer) b.classList.add("correct"); });
    document.getElementById("next-btn").style.display = "block";
  }
}

function renderWrite(){
  const word = currentWord;
  function normalizeText(t){
    return (t||"").toLowerCase().replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9äöüß\s]/g,"")
      .replace(/\s+/g," ").trim();
  }

  function parseVariants(s){
    if(!s) return [];
    const variants = [];
    // main without parentheses
    const withoutParens = s.replace(/\s*\([^)]*\)/g, ' ').trim();
    if(withoutParens) variants.push(withoutParens);
    // extract parentheses contents as alternatives
    const parenMatches = [...s.matchAll(/\(([^)]+)\)/g)];
    parenMatches.forEach(m => { if(m[1]) variants.push(m[1].trim()); });
    // replace 'oder' with comma to split
    const flat = variants.map(v => v.replace(/\boder\b/gi, ',')).join(',');
    // split on common separators
    const parts = flat.split(/[\/,;|\\]/).map(p => p.trim()).filter(Boolean);
    return parts;
  }

  function buildAcceptedAnswers(correct){
    const variants = parseVariants(correct);
    const acc = new Set();
    variants.forEach(v => {
      let norm = normalizeText(v);
      if(!norm) return;
      acc.add(norm);
      // allow omitting indefinite articles (ein/eine/einen)
      const m = norm.match(/^(ein|eine|einen)\s+(.*)$/);
      if(m && m[2]) acc.add(normalizeText(m[2]));
      // also allow variants where parentheses content was the alternative: handled by parseVariants
    });
    return acc;
  }
  cardEl.innerHTML = `
    <div class="prompt-hint">Übersetze ins Deutsche</div>
    <div class="prompt-row-flex">
      <div class="prompt-word">${displayArabic(word.arabic)}</div>
    </div>
    <div class="type-row">
      <input type="text" id="write-input" autocomplete="off" placeholder="Antwort eingeben…" />
      <button id="write-submit">Prüfen</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" style="display:none;">Nächste Vokabel ➔</button>
  `;

  const input = document.getElementById("write-input");
  input.focus();
  function submit(){
    if(input.disabled) return;
    const userRaw = input.value || "";
    const user = normalizeText(userRaw);
    const correctRaw = word.german || "";
    const accepted = buildAcceptedAnswers(correctRaw);

    // If correct answer contains a definite article, require it (no alt without it was added).
    const correct = accepted.has(user);

    markResult(word, correct);
    input.disabled = true;
    const feedback = document.getElementById("feedback");
    if(correct){
      feedback.innerText = "Richtig! 🎉";
      feedback.className = "feedback ok";
      document.getElementById("next-btn").style.display = "none";
      scheduleNextCard();
    } else {
      feedback.innerText = `Falsch — richtig wäre: ${word.german}`;
      feedback.className = "feedback bad";
      document.getElementById("next-btn").style.display = "block";
    }
  }
  document.getElementById("write-submit").onclick = submit;
  input.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  document.getElementById("next-btn").onclick = nextCard;
}

/* ---------- Glossar ----------
   Zeigt alle Vokabeln (außer dem Sonderblock "Grammatik") gruppiert nach
   den Kategorien aus CATEGORIES (vocab.js). Ein Wort kann in mehreren
   Kategorien gleichzeitig auftauchen, wenn sein "categories"-Array
   mehrere Schlüssel enthält. Wörter ohne (oder mit leerem) "categories"-
   Feld landen unter "Nicht zugeordnet". */
let glossaryFilter = "alle";

function allVocabWords(){
  return Object.entries(LESSONS)
    .filter(([key]) => key !== "Grammatik")
    .flatMap(([, words]) => words);
}

function buildGlossaryTabs(){
  const wrap = document.getElementById("glossary-cat-tabs");
  wrap.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "lesson-pill" + (glossaryFilter === "alle" ? " active" : "");
  allBtn.textContent = "Alle";
  allBtn.dataset.key = "alle";
  wrap.appendChild(allBtn);

  Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "lesson-pill" + (glossaryFilter === key ? " active" : "");
    btn.textContent = CATEGORIES[key].de;
    btn.dataset.key = key;
    wrap.appendChild(btn);
  });

  wrap.onclick = e => {
    const btn = e.target.closest(".lesson-pill");
    if(!btn) return;
    Sound.click();
    glossaryFilter = btn.dataset.key;
    [...wrap.children].forEach(b => b.classList.toggle("active", b === btn));
    renderGlossaryList();
  };
}

function glossaryGroupHtml(key){
  const cat = CATEGORIES[key];
  const words = allVocabWords().filter(w => Array.isArray(w.categories) && w.categories.includes(key));
  let html = `<div class="glossary-group">
      <div class="glossary-group-title">${cat.de} <span class="ar">${cat.ar}</span><span class="count">(${words.length})</span></div>`;
  if(words.length === 0){
    html += `<div class="glossary-empty">Noch keine Vokabeln zugeordnet.</div>`;
  } else {
    words.forEach(w => {
      html += `<div class="glossary-word-row"><span class="ar">${displayArabic(w.arabic)}</span><span class="de">${w.german}</span></div>`;
    });
  }
  html += `</div>`;
  return html;
}

function renderGlossaryList(){
  const listEl = document.getElementById("glossary-list");
  if(glossaryFilter === "alle"){
    let html = Object.keys(CATEGORIES).map(glossaryGroupHtml).join("");
    const uncategorized = allVocabWords().filter(w => !w.categories || w.categories.length === 0);
    html += `<div class="glossary-group">
        <div class="glossary-group-title">Nicht zugeordnet <span class="count">(${uncategorized.length})</span></div>`;
    if(uncategorized.length === 0){
      html += `<div class="glossary-empty">Alle Vokabeln sind einer Kategorie zugeordnet.</div>`;
    } else {
      uncategorized.forEach(w => {
        html += `<div class="glossary-word-row"><span class="ar">${displayArabic(w.arabic)}</span><span class="de">${w.german}</span></div>`;
      });
      html += `<div class="glossary-empty">Zum Einordnen in <kbd>vocab.js</kbd> ein Feld <kbd>categories: ["..."]</kbd> ergänzen — ein Wort kann mehrere Kategorien gleichzeitig haben.</div>`;
    }
    html += `</div>`;
    listEl.innerHTML = html;
  } else {
    listEl.innerHTML = glossaryGroupHtml(glossaryFilter);
  }
}

function openGlossary(){
  glossaryFilter = "alle";
  buildGlossaryTabs();
  renderGlossaryList();
  const overlay = document.getElementById("glossary-overlay");
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden", "false");
}
function closeGlossary(){
  const overlay = document.getElementById("glossary-overlay");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden", "true");
}
document.querySelectorAll("[data-open-glossary]").forEach(el => el.addEventListener("click", () => { Sound.click(); openGlossary(); }));
document.addEventListener("keydown", e => { if(e.key === "Escape") closeGlossary(); });
document.getElementById("glossary-close").addEventListener("click", () => { Sound.click(); closeGlossary(); });
document.getElementById("glossary-overlay").addEventListener("click", e => {
  if(e.target.id === "glossary-overlay") closeGlossary();
});

// Init
buildLessonTabs();
setMode("flash");
updateStats();
const glossaryCountEl = document.getElementById("glossary-count");
if(glossaryCountEl) glossaryCountEl.textContent = allVocabWords().length;
if(location.hash === "#glossar") openGlossary();   // Direktlink, z. B. aus dem Grammatiktrainer

// Absicherung: die Seite soll nie waagerecht verschoben sein
window.addEventListener("scroll", () => { if(window.scrollX) window.scrollTo(0, window.scrollY); }, { passive: true });
</script>
