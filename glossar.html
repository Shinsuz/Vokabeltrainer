<script>
/* Glossar — zeigt alle Vokabeln (außer dem Sonderblock "Grammatik") gruppiert
   nach den Kategorien aus CATEGORIES (vocab.js). Ein Wort kann in mehreren
   Kategorien gleichzeitig auftauchen, wenn sein "categories"-Array mehrere
   Schlüssel enthält. Wörter ohne "categories" landen unter "Nicht zugeordnet". */
const HARAKAT_REGEX = /[ً-ْٖ-ٰٟۖ-ۭ]/g;
function stripHarakat(text){ return String(text || "").replace(HARAKAT_REGEX, ""); }
let showHarakat = true;
function displayArabic(text){ return showHarakat ? text : stripHarakat(text); }
function pluralHtml(w){
  return w && w.plural ? `<span class="plural-line">Plural: <span class="ar">${displayArabic(w.plural)}</span></span>` : "";
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }

let glossaryFilter = "alle";
let glossaryQuery = "";

function allVocabWords(){
  return Object.entries(LESSONS)
    .filter(([key]) => key !== "Grammatik")
    .flatMap(([, words]) => words);
}
/* Suche: Deutsch ohne Groß/Klein und Akzente, Arabisch ohne Haraket */
function glossaryNorm(t){
  return stripHarakat(t).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/ـ/g, "").trim();
}
function matchesQuery(w){
  if(!glossaryQuery) return true;
  return glossaryNorm(w.arabic).includes(glossaryQuery)
      || glossaryNorm(w.german).includes(glossaryQuery)
      || (w.plural && glossaryNorm(w.plural).includes(glossaryQuery));
}
function wordsOf(key){
  return allVocabWords().filter(w => key === "_none"
    ? (!w.categories || w.categories.length === 0)
    : (Array.isArray(w.categories) && w.categories.includes(key)));
}

function rowHtml(w){
  return `<div class="glossary-word-row"><span class="ar" lang="ar">${displayArabic(w.arabic)}</span><span class="de">${w.german}${pluralHtml(w)}</span></div>`;
}

function buildTabs(){
  const wrap = document.getElementById("glossary-cat-tabs");
  const keys = ["alle", ...Object.keys(CATEGORIES)];
  wrap.innerHTML = keys.map(k => {
    const label = k === "alle" ? "Alle" : CATEGORIES[k].de.replace(/\s*\(.*\)$/, "");
    const n = k === "alle" ? allVocabWords().length : wordsOf(k).length;
    return `<button type="button" class="lesson-pill${glossaryFilter === k ? " active" : ""}" data-key="${k}">${label} <span class="chip-count">${n}</span></button>`;
  }).join("");
  wrap.onclick = e => {
    const btn = e.target.closest(".lesson-pill");
    if(!btn) return;
    glossaryFilter = btn.dataset.key;
    [...wrap.children].forEach(b => b.classList.toggle("active", b === btn));
    render();
    window.scrollTo({ top: 0 });
  };
}

function groupHtml(key, title, arTitle){
  const words = wordsOf(key).filter(matchesQuery);
  if(words.length === 0) return glossaryQuery ? "" :
    `<section class="glossary-group"><h2 class="glossary-group-title">${title}${arTitle ? ` <span class="ar">${arTitle}</span>` : ""}<span class="count">0</span></h2><div class="glossary-empty">Noch keine Vokabeln zugeordnet.</div></section>`;
  return `<section class="glossary-group">
    <h2 class="glossary-group-title">${title}${arTitle ? ` <span class="ar">${arTitle}</span>` : ""}<span class="count">${words.length}</span></h2>
    ${words.map(rowHtml).join("")}
  </section>`;
}

function render(){
  const listEl = document.getElementById("glossary-list");
  const keys = glossaryFilter === "alle" ? Object.keys(CATEGORIES) : [glossaryFilter];
  let html = keys.map(k => groupHtml(k, CATEGORIES[k].de, CATEGORIES[k].ar)).join("");
  if(glossaryFilter === "alle" && wordsOf("_none").length) html += groupHtml("_none", "Nicht zugeordnet", "");

  const result = document.getElementById("glossary-result");
  if(glossaryQuery){
    const hits = new Set(allVocabWords().filter(matchesQuery).filter(w => glossaryFilter === "alle" || wordsOf(glossaryFilter).includes(w))).size;
    result.textContent = hits ? `${hits} Treffer für „${glossarySearch.value.trim()}“` : "";
  } else result.textContent = "";

  listEl.innerHTML = html || `<div class="glossary-empty big-empty">Nichts gefunden für „${escapeHtml(glossarySearch.value.trim())}“.<br>Tipp: Arabisch geht auch ohne Haraket.</div>`;
}

const glossarySearch = document.getElementById("glossary-search");
glossarySearch.addEventListener("input", () => {
  glossaryQuery = glossaryNorm(glossarySearch.value);
  render();
});
document.getElementById("harakat-checkbox").addEventListener("change", e => {
  showHarakat = e.target.checked;
  render();
});

const total = allVocabWords().length;
document.getElementById("glossary-count").textContent = `Alle ${total} Vokabeln nach Wortart – Verb, Präposition, Pronomen u. a.`;
/* Direktlink auf eine Kategorie möglich, z. B. glossar.html#fiil */
const hashKey = decodeURIComponent(location.hash.slice(1));
if(CATEGORIES[hashKey]) glossaryFilter = hashKey;
buildTabs();
render();
</script>
